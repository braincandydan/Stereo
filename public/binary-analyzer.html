<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary YES / NO</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  h1 { font-size: 2rem; font-weight: 800; color: #38bdf8; letter-spacing: -0.02em; margin-bottom: 6px; }
  .tagline { color: #64748b; font-size: 0.9rem; margin-bottom: 48px; text-align: center; }

  /* ── Input ── */
  .input-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 40px;
  }
  input[type="text"] {
    flex: 1;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 10px;
    color: #f1f5f9;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  input[type="text"]:focus { border-color: #38bdf8; }
  input[type="text"]::placeholder { color: #334155; font-weight: 400; }
  button {
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 800;
    padding: 14px 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  button:hover  { background: #7dd3fc; }
  button:active { transform: scale(0.97); }

  /* ── Result card ── */
  #result {
    width: 100%;
    max-width: 600px;
    display: none;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
  }

  /* number + binary */
  .num-display {
    font-size: 2.2rem;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .num-label { font-size: 0.75rem; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px; }

  .bits-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 24px;
  }
  .bit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 7px;
    font-size: 1rem;
    font-weight: 800;
    font-family: 'Courier New', monospace;
  }
  .bit-1 { background: #14532d; color: #4ade80; box-shadow: 0 0 8px #4ade8033; }
  .bit-0 { background: #1c1917; color: #64748b; }
  .bit-sep { width: 6px; } /* spacer between groups of 4 */

  /* balance bar */
  .balance-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .balance-track {
    flex: 1;
    height: 10px;
    background: #0f172a;
    border-radius: 99px;
    overflow: hidden;
  }
  .balance-fill-yes { height: 100%; border-radius: 99px; background: #4ade80; transition: width 0.4s ease; }
  .balance-fill-no  { height: 100%; border-radius: 99px; background: #f87171; transition: width 0.4s ease; }
  .balance-lbl { font-size: 0.8rem; font-weight: 700; width: 70px; flex-shrink: 0; }
  .balance-cnt { font-size: 0.8rem; color: #64748b; }

  /* verdict */
  .verdict-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 28px 0 20px;
  }
  .verdict {
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .verdict-yes { color: #4ade80; text-shadow: 0 0 40px #4ade8055; }
  .verdict-no  { color: #f87171; text-shadow: 0 0 40px #f8717155; }

  /* reasoning */
  .reason {
    background: #0f172a;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #94a3b8;
    line-height: 1.65;
    text-align: center;
  }
  .reason strong { color: #e2e8f0; }

  /* stats row */
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 90px;
    background: #0f172a;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat-val { font-size: 1.5rem; font-weight: 800; }
  .stat-lbl { font-size: 0.68rem; color: #475569; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 3px; }
  .s-ones  { color: #4ade80; }
  .s-zeros { color: #f87171; }
  .s-bits  { color: #94a3b8; }
  .s-ver-yes { color: #4ade80; }
  .s-ver-no  { color: #f87171; }

  .error-msg {
    color: #f87171;
    font-size: 0.85rem;
    margin-top: -28px;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Binary YES / NO</h1>
<p class="tagline">Enter any positive integer — its binary pattern decides the answer.</p>

<div class="input-row">
  <input type="text" id="numInput" placeholder="e.g. 2732" inputmode="numeric" autocomplete="off" />
  <button id="analyzeBtn">Analyze</button>
</div>

<div id="errorMsg" class="error-msg" style="display:none"></div>

<div id="result">
  <div class="card">
    <div class="num-display" id="displayNum"></div>
    <div class="num-label">decimal &nbsp;→&nbsp; binary</div>
    <div class="bits-wrap" id="bitsDisplay"></div>

    <div class="balance-row">
      <div class="balance-lbl" style="color:#4ade80;text-align:right" id="onesLbl"></div>
      <div class="balance-track"><div id="balanceFill"></div></div>
      <div class="balance-lbl" style="color:#f87171" id="zerosLbl"></div>
    </div>
    <div style="text-align:center;font-size:0.75rem;color:#475569;margin-bottom:0" id="balanceNote"></div>

    <div class="verdict-wrap">
      <div class="verdict" id="verdictText"></div>
    </div>

    <div class="reason" id="reasonText"></div>
  </div>

  <div class="card">
    <div class="stats" id="statsRow"></div>
  </div>
</div>

<script>
function analyze(raw) {
  const n = parseInt(raw, 10);
  if (isNaN(n) || n < 0 || !Number.isFinite(n)) return null;
  if (n > Number.MAX_SAFE_INTEGER) return null;

  const binary = n.toString(2);
  const ones  = binary.split('').filter(b => b === '1').length;
  const zeros = binary.length - ones;
  const isTie = ones === zeros;

  let verdict, reason;

  if (ones > zeros) {
    verdict = 'YES';
    reason  = `<strong>${ones} ones</strong> outnumber <strong>${zeros} zeros</strong> — ones win.`;
  } else if (zeros > ones) {
    verdict = 'NO';
    reason  = `<strong>${zeros} zeros</strong> outnumber <strong>${ones} ones</strong> — zeros win.`;
  } else {
    // Tiebreaker: sum of bit positions (0 = rightmost) of all 1-bits.
    // Odd sum → YES, even sum → NO.
    // This is unique to each number — two different numbers with the same
    // ones/zeros count still have different bit positions, giving different verdicts.
    let posSum = 0;
    for (let i = 0; i < binary.length; i++) {
      if (binary[i] === '1') posSum += (binary.length - 1 - i);
    }
    verdict = (posSum % 2 === 1) ? 'YES' : 'NO';
    reason  = `Equal <strong>${ones} ones</strong> and <strong>${zeros} zeros</strong> — it's a tie.`
            + ` Tiebreaker: sum of 1-bit positions = <strong>${posSum}</strong>`
            + ` (${posSum % 2 === 1 ? 'odd → YES' : 'even → NO'}).`;
  }

  return { n, binary, ones, zeros, isTie, verdict, reason };
}

function renderBits(binary) {
  const wrap = document.getElementById('bitsDisplay');
  wrap.innerHTML = '';
  for (let i = 0; i < binary.length; i++) {
    if (i > 0 && (binary.length - i) % 4 === 0) {
      const sep = document.createElement('div');
      sep.className = 'bit-sep';
      wrap.appendChild(sep);
    }
    const el = document.createElement('div');
    el.className = 'bit ' + (binary[i] === '1' ? 'bit-1' : 'bit-0');
    el.textContent = binary[i];
    wrap.appendChild(el);
  }
}

function run() {
  const raw = document.getElementById('numInput').value.trim().replace(/,/g, '');
  const errEl = document.getElementById('errorMsg');

  if (!raw) { errEl.style.display = 'none'; return; }

  const r = analyze(raw);
  if (!r) {
    errEl.textContent = 'Please enter a positive integer (up to ' + Number.MAX_SAFE_INTEGER.toLocaleString() + ').';
    errEl.style.display = 'block';
    document.getElementById('result').style.display = 'none';
    return;
  }
  errEl.style.display = 'none';

  document.getElementById('displayNum').textContent = r.n.toLocaleString();

  renderBits(r.binary);

  // Balance bar
  const pct = Math.round((r.ones / r.binary.length) * 100);
  const fill = document.getElementById('balanceFill');
  fill.className = r.ones >= r.zeros ? 'balance-fill-yes' : 'balance-fill-no';
  fill.style.width = pct + '%';
  document.getElementById('onesLbl').textContent = r.ones + ' ones';
  document.getElementById('zerosLbl').textContent = r.zeros + ' zeros';
  document.getElementById('balanceNote').textContent =
    r.isTie ? '⚖ Perfect tie — tiebreaker applied' : '';

  // Verdict
  const vEl = document.getElementById('verdictText');
  vEl.textContent = r.verdict;
  vEl.className = 'verdict ' + (r.verdict === 'YES' ? 'verdict-yes' : 'verdict-no');

  document.getElementById('reasonText').innerHTML = r.reason;

  // Stats
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="stat-val s-ones">${r.ones}</div><div class="stat-lbl">Ones (1s)</div></div>
    <div class="stat"><div class="stat-val s-zeros">${r.zeros}</div><div class="stat-lbl">Zeros (0s)</div></div>
    <div class="stat"><div class="stat-val s-bits">${r.binary.length}</div><div class="stat-lbl">Total bits</div></div>
    <div class="stat"><div class="stat-val ${r.verdict === 'YES' ? 's-ver-yes' : 's-ver-no'}">${r.verdict}</div><div class="stat-lbl">Verdict</div></div>
  `;

  const res = document.getElementById('result');
  res.style.display = 'block';
  res.style.animation = 'none';
  void res.offsetHeight; // reflow to restart animation
  res.style.animation = '';
}

document.getElementById('analyzeBtn').addEventListener('click', run);
document.getElementById('numInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') run();
});
</script>

</body>
</html>
