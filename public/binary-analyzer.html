<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary YES/NO Analyzer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; min-height: 100vh; }
  h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
  .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }

  .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.15s; letter-spacing: 0.02em; }
  .btn:hover { background: #7dd3fc; }

  .cards { display: flex; gap: 14px; margin: 22px 0; flex-wrap: wrap; }
  .card { background: #1e293b; border-radius: 12px; padding: 18px 22px; flex: 1; min-width: 130px; border: 1px solid #334155; }
  .card-value { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .card-label { font-size: 0.78rem; color: #64748b; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .c-yes { color: #4ade80; }
  .c-no  { color: #f87171; }
  .c-tie { color: #fbbf24; }
  .c-neu { color: #94a3b8; }

  .charts { display: flex; gap: 14px; margin: 0 0 22px 0; flex-wrap: wrap; }
  .chart-box { background: #1e293b; border-radius: 12px; padding: 20px; flex: 1; min-width: 260px; border: 1px solid #334155; }
  .chart-title { font-size: 0.9rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 18px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-lbl { width: 56px; font-size: 0.85rem; font-weight: 700; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; background: #0f172a; border-radius: 5px; height: 30px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 5px; display: flex; align-items: center; padding-left: 10px; font-size: 0.8rem; font-weight: 700; min-width: 32px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .bar-pct { font-size: 0.78rem; color: #64748b; width: 38px; flex-shrink: 0; }

  .section { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 22px; border: 1px solid #334155; }
  .section-title { font-size: 1.05rem; font-weight: 700; color: #38bdf8; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .analysis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .a-item { background: #0f172a; border-radius: 8px; padding: 12px; }
  .a-lbl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }
  .a-val { font-size: 1.15rem; font-weight: 800; margin-top: 5px; font-family: 'Courier New', monospace; }

  .rank-note { font-size: 0.9rem; color: #cbd5e1; margin-top: 14px; line-height: 1.6; }
  strong.hl { color: #f59e0b; }
  strong.yes { color: #4ade80; }
  strong.no  { color: #f87171; }

  .hist-wrap { margin-top: 16px; }
  .hist-label { font-size: 0.75rem; color: #475569; margin-bottom: 6px; }
  .hist { display: flex; align-items: flex-end; gap: 3px; background: #0f172a; padding: 12px 10px 8px; border-radius: 8px; overflow-x: auto; min-height: 110px; }
  .hist-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 22px; }
  .hist-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 3px; transition: height 0.4s ease; }
  .hist-xtick { font-size: 0.62rem; color: #475569; white-space: nowrap; }
  .hist-count { font-size: 0.6rem; color: #64748b; }
  .hist-tag { font-size: 0.6rem; font-weight: 800; color: #f59e0b; }
  .hist-arrow { font-size: 0.7rem; color: #475569; margin-top: 4px; display: flex; justify-content: space-between; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 640px; }
  th { background: #0f172a; padding: 9px 12px; text-align: left; color: #64748b; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid #334155; }
  td { padding: 7px 12px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
  tr:hover td { background: #172033; }
  .bin { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #7dd3fc; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 0.72rem; font-weight: 800; }
  .b-yes { background: #14532d; color: #4ade80; }
  .b-no  { background: #450a0a; color: #f87171; }
  .b-tie { background: #451a03; color: #fbbf24; font-size: 0.68rem; }
  .t-yes { color: #4ade80; font-weight: 700; }
  .t-no  { color: #f87171; font-weight: 700; }
  .t-tie { color: #fbbf24; }
  .t-dim { color: #475569; }
  .t-scroll { max-height: 520px; overflow-y: auto; }

  .interp { line-height: 1.75; color: #cbd5e1; font-size: 0.9rem; }
  .interp p { margin-bottom: 12px; }
  .interp p:last-child { margin-bottom: 0; }
  code { background: #0f172a; padding: 2px 7px; border-radius: 5px; color: #7dd3fc; font-family: 'Courier New', monospace; font-size: 0.85em; }

  @media (max-width: 600px) {
    body { padding: 14px; }
    h1 { font-size: 1.4rem; }
    .card-value { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<h1>Binary YES/NO Analyzer</h1>
<p class="subtitle">Tests whether integers lean YES or NO based on their binary representation</p>
<button class="btn" id="generateBtn">&#x21BB;&nbsp; Generate New Sample</button>

<div id="output" style="margin-top:24px"></div>

<script>
function analyze(n) {
  const bin = n.toString(2);
  const ones  = (bin.match(/1/g) || []).length;
  const zeros = bin.length - ones;
  const isTie = ones === zeros;
  const xor   = ones % 2;          // parity of 1-count = XOR of all bits
  const last  = n & 1;
  let verdict;
  if (ones > zeros)      verdict = 'YES';
  else if (zeros > ones) verdict = 'NO';
  else                   verdict = xor === 1 ? 'YES' : 'NO';
  const balance = Math.abs(ones - zeros);
  return { n, bin, ones, zeros, isTie, xor, last, verdict, balance };
}

function buildHistogram(results, special) {
  const freq = {};
  results.forEach(r => { freq[r.balance] = (freq[r.balance] || 0) + 1; });
  const keys = Object.keys(freq).map(Number).sort((a,b)=>a-b);
  const maxFreq = Math.max(...Object.values(freq));
  const maxPx = 72;

  const cols = keys.map(k => {
    const h  = Math.max(3, Math.round((freq[k] / maxFreq) * maxPx));
    const hi = (k === special.balance);
    const bg = hi ? '#f59e0b' : '#334155';
    const tag = hi ? `<div class="hist-tag">2732</div>` : '';
    return `<div class="hist-col">
      ${tag}
      <div class="hist-count" style="color:${hi?'#f59e0b':'#475569'}">${freq[k]}</div>
      <div class="hist-bar" style="background:${bg};height:${h}px" title="Balance ${k}: ${freq[k]} number(s)"></div>
      <div class="hist-xtick" style="color:${hi?'#f59e0b':'#475569'};font-weight:${hi?700:400}">${k}</div>
    </div>`;
  }).join('');

  return `<div class="hist-wrap">
    <div class="hist-label">Balance score distribution — <span style="color:#f59e0b">&#9646;</span> = where 2732 sits &nbsp;|&nbsp; score = |ones − zeros|, lower = more balanced</div>
    <div class="hist">${cols}</div>
    <div class="hist-arrow"><span>&#8592; more balanced</span><span>less balanced &#8594;</span></div>
  </div>`;
}

function run() {
  const nums    = Array.from({length:100}, () => Math.floor(Math.random() * 100000000) + 1);
  const results = nums.map(analyze);
  const sp      = analyze(2732);

  const yesCount = results.filter(r => r.verdict === 'YES').length;
  const noCount  = 100 - yesCount;
  const tieCount = results.filter(r => r.isTie).length;

  const betterThan = results.filter(r => r.balance > sp.balance).length;
  const sameAs     = results.filter(r => r.balance === sp.balance).length;
  const topPct     = Math.round(((100 - betterThan) / 100) * 100);

  const dominant   = yesCount >= noCount ? 'YES' : 'NO';
  const oddBits    = sp.ones % 2 === 0 ? 'even' : 'odd';

  const html = `
  <!-- Summary cards -->
  <div class="cards">
    <div class="card"><div class="card-value c-yes">${yesCount}</div><div class="card-label">YES verdicts</div></div>
    <div class="card"><div class="card-value c-no">${noCount}</div><div class="card-label">NO verdicts</div></div>
    <div class="card"><div class="card-value c-tie">${tieCount}</div><div class="card-label">Ties (1s = 0s)</div></div>
    <div class="card"><div class="card-value c-neu">2,732</div><div class="card-label">Special number → <span class="${sp.verdict==='YES'?'c-yes':'c-no'}">${sp.verdict}</span></div></div>
  </div>

  <!-- Charts row -->
  <div class="charts">
    <div class="chart-box">
      <div class="chart-title">YES vs NO verdicts (out of 100)</div>
      <div class="bar-row">
        <div class="bar-lbl c-yes">YES</div>
        <div class="bar-track"><div class="bar-fill" style="width:${yesCount}%;background:#4ade80;color:#0f172a">${yesCount}</div></div>
        <div class="bar-pct">${yesCount}%</div>
      </div>
      <div class="bar-row">
        <div class="bar-lbl c-no">NO</div>
        <div class="bar-track"><div class="bar-fill" style="width:${noCount}%;background:#f87171;color:#0f172a">${noCount}</div></div>
        <div class="bar-pct">${noCount}%</div>
      </div>
    </div>
    <div class="chart-box">
      <div class="chart-title">Ties vs non-ties (out of 100)</div>
      <div class="bar-row">
        <div class="bar-lbl c-tie">Tied</div>
        <div class="bar-track"><div class="bar-fill" style="width:${tieCount}%;background:#fbbf24;color:#0f172a">${tieCount}</div></div>
        <div class="bar-pct">${tieCount}%</div>
      </div>
      <div class="bar-row">
        <div class="bar-lbl c-neu" style="font-size:0.78rem">No tie</div>
        <div class="bar-track"><div class="bar-fill" style="width:${100-tieCount}%;background:#475569;color:#e2e8f0">${100-tieCount}</div></div>
        <div class="bar-pct">${100-tieCount}%</div>
      </div>
    </div>
  </div>

  <!-- 2732 deep-dive -->
  <div class="section">
    <div class="section-title">&#x2756; Analysis: 2,732</div>
    <div class="analysis-grid">
      <div class="a-item"><div class="a-lbl">Number</div><div class="a-val">2,732</div></div>
      <div class="a-item"><div class="a-lbl">Binary</div><div class="a-val" style="font-size:0.95rem;color:#7dd3fc;letter-spacing:0.08em">${sp.bin}</div></div>
      <div class="a-item"><div class="a-lbl">Bit length</div><div class="a-val">${sp.bin.length}</div></div>
      <div class="a-item"><div class="a-lbl">Ones (1s)</div><div class="a-val c-yes">${sp.ones}</div></div>
      <div class="a-item"><div class="a-lbl">Zeros (0s)</div><div class="a-val c-no">${sp.zeros}</div></div>
      <div class="a-item"><div class="a-lbl">Tie?</div><div class="a-val ${sp.isTie?'c-tie':'c-neu'}">${sp.isTie?'YES':'NO'}</div></div>
      <div class="a-item"><div class="a-lbl">XOR parity</div><div class="a-val">${sp.xor}</div></div>
      <div class="a-item"><div class="a-lbl">Last bit</div><div class="a-val">${sp.last} (${sp.last?'odd':'even'})</div></div>
      <div class="a-item"><div class="a-lbl">Balance score</div><div class="a-val" style="color:#f59e0b">${sp.balance}</div></div>
      <div class="a-item"><div class="a-lbl">Final verdict</div><div class="a-val ${sp.verdict==='YES'?'c-yes':'c-no'}">${sp.verdict}</div></div>
    </div>

    <div class="rank-note">
      2,732 has a balance score of <strong class="hl">${sp.balance}</strong> — ${sp.balance===0?'<strong style="color:#4ade80">perfectly balanced</strong> (equal 1s and 0s)':'a difference of '+sp.balance+' bit(s)'}.<br>
      It is more balanced than <strong class="hl">${betterThan} of the 100 random numbers</strong>
      ${sameAs > 0 ? `(${sameAs} share the same score)` : ''}, placing it in the
      <strong class="hl">top ${topPct}%</strong> for balance in this sample.
      ${sp.isTie
        ? `Since it ties, the tiebreaker is XOR parity: ${sp.ones} one-bits is ${oddBits}, so XOR = ${sp.xor} → verdict = <strong class="${sp.verdict==='YES'?'yes':'no'}">${sp.verdict}</strong>.`
        : `It is not tied — ${sp.ones > sp.zeros ? 'ones dominate' : 'zeros dominate'} → <strong class="${sp.verdict==='YES'?'yes':'no'}">${sp.verdict}</strong>.`
      }
    </div>

    ${buildHistogram(results, sp)}
  </div>

  <!-- Full table -->
  <div class="section">
    <div class="section-title">&#x25A6; All 100 Numbers</div>
    <div class="table-wrap">
      <div class="t-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Number</th>
              <th>Binary</th>
              <th>Ones</th>
              <th>Zeros</th>
              <th>Tie?</th>
              <th>XOR</th>
              <th>Last Bit</th>
              <th>Verdict</th>
            </tr>
          </thead>
          <tbody>
            ${results.map((r,i) => `<tr>
              <td class="t-dim">${i+1}</td>
              <td>${r.n.toLocaleString()}</td>
              <td class="bin" title="${r.bin}">${r.bin}</td>
              <td class="t-yes">${r.ones}</td>
              <td class="t-no">${r.zeros}</td>
              <td class="${r.isTie?'t-tie':''}">${r.isTie?'TIE':'—'}</td>
              <td>${r.xor}</td>
              <td>${r.last}</td>
              <td><span class="badge ${r.verdict==='YES'?'b-yes':'b-no'}">${r.verdict}</span>
                  ${r.isTie?'<span class="badge b-tie" style="margin-left:4px">tie</span>':''}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Interpretation -->
  <div class="section">
    <div class="section-title">&#x2B50; Plain-English Interpretation</div>
    <div class="interp">
      <p>Out of 100 randomly generated integers (1 – 100,000,000), <strong class="yes">${yesCount} returned YES</strong> and <strong class="no">${noCount} returned NO</strong>. The sample leans <strong>${dominant}</strong> — a typical result, since larger integers in this range tend to sit in the upper half of a 26–27 bit range where the leading 1-bits slightly tip the balance toward ones.</p>
      <p>Only <strong class="c-tie" style="color:#fbbf24">${tieCount} number(s)</strong> produced a true binary tie (equal 1s and 0s). This is relatively rare: to tie, a number's bit length must be even <em>and</em> exactly half the bits must be 1, which constrains the pool significantly.</p>
      <p>The <strong>XOR parity</strong> tiebreaker measures whether the total number of 1-bits is odd (XOR = 1 → YES) or even (XOR = 0 → NO). The <strong>last bit</strong> tells you if the number is odd (1) or even (0) — independent of the YES/NO verdict but a useful cross-check.</p>
      <p><strong>About 2,732:</strong> in binary it is <code>${sp.bin}</code> — ${sp.ones} ones and ${sp.zeros} zeros across ${sp.bin.length} bits. ${sp.isTie ? `It is a <strong style="color:#fbbf24">perfect tie</strong>, making it a maximally balanced number. With ${sp.ones} one-bits (${oddBits} count), XOR = ${sp.xor}, pushing the verdict to <strong class="${sp.verdict==='YES'?'c-yes':'c-no'}">${sp.verdict}</strong>.` : `Zeros ${sp.zeros > sp.ones ? 'outnumber' : 'are outnumbered by'} ones → <strong class="${sp.verdict==='YES'?'c-yes':'c-no'}">${sp.verdict}</strong>.`} Its balance score of <strong style="color:#f59e0b">${sp.balance}</strong> makes it more balanced than ${betterThan}% of this random sample — statistically unusual for a random draw.</p>
    </div>
  </div>`;

  document.getElementById('output').innerHTML = html;
}

document.getElementById('generateBtn').addEventListener('click', run);
run();
</script>
</body>
</html>
